[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pishgarm-docs"
version = "1.0.0"
description = "دفتر اسناد پیشگرم — صدور نامه، پیش‌فاکتور، فاکتور و صورت‌وضعیت"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "SQLAlchemy>=2.0",
  "docxtpl>=0.18",
  "python-docx>=1.1",
  "jdatetime>=5.0",
  "pypdf>=4.0",
  "pypdfium2>=4.0",
  "Pillow>=10",
  "pywin32; sys_platform=='win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.6", "pytest"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
