name: build-windows

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e .[dev]
      - run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }

  build:
    runs-on: windows-latest
    permissions:
      contents: write   # to publish the GitHub Release on a v* tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[build]
      - run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - run: choco install innosetup -y --no-progress
      - run: python tools/build_windows.py --skip-tests
        env: { PYTHONUTF8: "1" }
      - uses: actions/upload-artifact@v4
        with:
          name: PishgarmDocsSetup
          path: dist/PishgarmDocsSetup.exe
      - name: Read app version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import app; print(app.__version__)')" >> "$GITHUB_OUTPUT"
      # Every successful build publishes (or refreshes) the release v<app version>;
      # the tag is created by the action through the API. Bump app/__init__.py for a new release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: دفتر اسناد پیشگرم v${{ steps.ver.outputs.version }}
          files: dist/PishgarmDocsSetup.exe
          overwrite_files: true
          make_latest: true
          body: |
            ## نصب
            1. فایل **PishgarmDocsSetup.exe** را از پایین همین صفحه دانلود کنید.
            2. اجرا کنید. اگر Windows SmartScreen هشدار داد: **More info** ← **Run anyway**.
            3. مراحل نصب را جلو بروید؛ آیکون «دفتر اسناد پیشگرم» روی دسکتاپ ساخته می‌شود.

            نیاز: ویندوز ۱۰ یا ۱۱، ۶۴ بیتی. اطلاعات در `%LOCALAPPDATA%\PishgarmDocs` می‌ماند و با نصب نسخه‌ی جدید پاک نمی‌شود.

            ساخته‌شده از کامیت ${{ github.sha }}.
