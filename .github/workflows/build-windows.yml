name: build-windows

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e .[dev]
      - run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }

  build:
    runs-on: windows-latest
    permissions:
      contents: write   # to publish the GitHub Release on a v* tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[build]
      - run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - run: choco install innosetup -y --no-progress
      - run: python tools/build_windows.py --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: PishgarmDocsSetup
          path: dist/PishgarmDocsSetup.exe
      - name: Publish GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PishgarmDocsSetup.exe
          name: دفتر اسناد پیشگرم ${{ github.ref_name }}
          body: |
            فایل PishgarmDocsSetup.exe را دانلود و اجرا کنید (ویندوز ۱۰ یا ۱۱، ۶۴ بیتی).
            اگر Windows SmartScreen هشدار داد: More info ← Run anyway.
